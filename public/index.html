<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradeSource</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="/en/gb" data-spa class="logo" id="site-logo" data-cy="logoHome" data-testid="logo-home" title="TradeSource home"><img src="/images/favicon.svg" alt="" width="34" height="34" /><span class="logo-text">Trade<strong>Source</strong></span></a>

    <button type="button" class="locale-button" id="locale-button" data-cy="localeButton" data-testid="locale-button" aria-label="Choose location and language"><span>UK</span></button>

    <form class="search-form search-form--desktop" data-cy="searchFormDesktop" role="search">
      <input
        type="text"
        id="search-desktop"
        name="q"
        class="search-field"
        data-cy="searchFieldSearch"
        data-testid="search-input"
        placeholder="Search TradeSource..."
        aria-label="Search products or manufacturers"
      />
      <button type="submit" class="search-button" id="search-button-desktop" data-cy="searchButton" data-testid="search-button" aria-label="Search" title="Search">&#128269;</button>
    </form>

    <div class="header-auth" id="header-auth" data-cy="headerAuth"></div>

    <button class="nav-toggle" id="nav-toggle" data-cy="navToggle" data-testid="nav-toggle" aria-label="Menu">&#9776;</button>

    <form class="search-form search-form--mobile" data-cy="searchFormMobile" role="search" hidden>
      <input
        type="text"
        id="search-mobile"
        name="q"
        class="search-field"
        data-cy="searchFieldSearch"
        data-testid="search-input"
        placeholder="Search TradeSource..."
        aria-label="Search products or manufacturers"
      />
      <button type="submit" class="search-button" id="search-button-mobile" data-cy="searchButton" data-testid="search-button" aria-label="Search" title="Search">&#128269;</button>
    </form>
  </header>

  <div class="main-nav-bar">
    <nav class="main-nav" aria-label="Main navigation links" data-cy="mainNav">
      <a href="/en/gb" data-spa data-cy="mainNavHome">Home</a>
      <div class="browse">
        <button type="button" id="browse-button" data-cy="browseButton" aria-expanded="false" aria-controls="browse-menu">Browse</button>
        <menu id="browse-menu" class="browse-menu" role="menu" aria-label="Browse menu" data-cy="browseMenu" hidden></menu>
      </div>
    </nav>
  </div>

  <main id="app"></main>

  <footer class="site-footer">
    <p>TradeSource is a fictional site built for automation-testing practice. Not a real company.</p>
  </footer>

  <script src="/data.js"></script>
  <script src="/util.js"></script>
  <script src="/app.js"></script>
  <script src="/overlays.js"></script>
</body>
</html>
